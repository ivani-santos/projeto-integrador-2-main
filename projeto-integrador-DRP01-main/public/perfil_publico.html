<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Perfil Público | FOTECTA</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <div class="brand-wrap">
        <span class="brand-avatar"></span>
        <div class="brand">FOTECTA</div>
      </div>
      <nav>
        <a href="/">Home</a>
        <a href="/busca">Busca</a>
      </nav>
    </header>

    <main class="profile-shell">
      <div class="profile-card-large">
        <div class="profile-header">
          <div class="avatar-profile">F</div>
          <div>
            <h1>Fotógrafo Demo</h1>
            <small>@fotodemo</small>
          </div>
        </div>

        <div class="profile-details">
          <div class="detail-block">
            <span>Especialidade</span>
            <strong>Casamentos, ensaios e eventos</strong>
          </div>
          <div class="detail-block">
            <span>Localização</span>
            <strong>São Paulo, SP</strong>
          </div>
          <div class="detail-block">
            <span>Preço</span>
            <strong>Sob consulta</strong>
          </div>
        </div>

        <div class="profile-actions">
          <button>Entrar em contato</button>
          <button class="secondary">Salvar favorito</button>
        </div>
      </div>
    </main>
  </body>
</html>
