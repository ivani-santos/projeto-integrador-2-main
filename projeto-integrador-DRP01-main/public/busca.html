<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Busca | FOTECTA</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <div class="brand-wrap">
        <span class="brand-avatar"></span>
        <div class="brand">FOTECTA</div>
      </div>
      <nav>
        <a href="/">Home</a>
        <a href="/busca">Busca</a>
      </nav>
    </header>

    <main class="search-shell">
      <section class="search-hero">
        <h1>Encontre seu fotógrafo</h1>
        <p>Pesquise por nome, estilo ou localidade e veja os profissionais disponíveis.</p>
        <div class="search-bar">
          <input type="text" id="buscaInput" placeholder="Buscar por nome do profissional..." />
          <button>Buscar</button>
        </div>
      </section>

      <div class="filter-row">
        <button class="filter active">Todos</button>
        <button class="filter">Casamentos</button>
        <button class="filter">Eventos</button>
        <button class="filter">Ensaios</button>
        <button class="filter">Publicidade</button>
      </div>

      <div id="users-list" class="grid search-grid"></div>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
