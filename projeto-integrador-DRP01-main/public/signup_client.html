<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cadastro de Cliente | FOTECTA</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <div><strong>FOTECTA</strong></div>
      <nav>
        <a href="/">Home</a>
        <a href="/login">Login</a>
        <a href="/cadastro">Cadastro</a>
      </nav>
    </header>

    <main>
      <div class="card" style="max-width: 500px; margin: 3rem auto;">
        <h2>Cadastro de cliente</h2>
        <div id="message" class="message"></div>
        <form id="register-form">
          <label>Nome<input id="nome" type="text" required /></label>
          <label>E-mail<input id="email" type="email" required /></label>
          <label>Senha<input id="senha" type="password" required /></label>
          <input type="hidden" id="tipo" value="cliente" />
          <button type="submit">Criar conta</button>
        </form>
      </div>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
