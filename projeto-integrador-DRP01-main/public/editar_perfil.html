<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Editar Perfil | FOTECTA</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <header>
      <div class="brand-wrap">
        <span class="brand-avatar"></span>
        <div class="brand">FOTECTA</div>
      </div>
      <nav>
        <a href="/">Home</a>
        <a href="/clientelogado">Painel</a>
      </nav>
    </header>

    <main class="profile-shell">
      <div class="profile-card-large edit-card">
        <h1>Editar perfil</h1>
        <div id="message" class="message"></div>
        <form id="register-form">
          <label>
            Nome
            <input id="nome" type="text" value="Cliente Demo" />
          </label>
          <label>
            Bio
            <textarea id="bio" rows="4">Photographer demo profile.</textarea>
          </label>
          <label>
            Localização
            <input id="localizacao" type="text" value="São Paulo, SP" />
          </label>
          <button type="submit">Salvar alterações</button>
        </form>
      </div>
    </main>

    <script src="/app.js"></script>
  </body>
</html>
